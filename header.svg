
<svg fill="none" viewBox="0 0 800 150" width="800" height="150" xmlns="http://www.w3.org/2000/svg">
	<foreignObject width="100%" height="100%">
		<div xmlns="http://www.w3.org/1999/xhtml">
			<style>
				@keyframes gradientBackground {
					0% {
						background-position: 0% 50%;
					}
					50% {
						background-position: 100% 50%;
					}
					100% {
						background-position: 0% 50%;
					}
				}

				.container {
					font-family:
						system-ui,
						-apple-system,
						'Segoe UI',
						Roboto,
						Helvetica,
						Arial,
						sans-serif;
					display: flex;
					flex-direction: column;
					align-items: center;
					justify-content: center;
					margin: 0;
					width: 100%;
					height: 150px;
					background: linear-gradient(-45deg, #667eea, #764ba2);
					background-size: 200% 200%;
					animation: gradientBackground 6s ease infinite;
					border-radius: 10px;
					color: white;
					text-align: center;
				}

				h1 {
					font-size: 48px;
					line-height: 1.2;
					letter-spacing: 6px;
					text-transform: uppercase;
					font-weight: 700;
					margin: 0;
				}

				.subtitle {
					font-size: 16px;
					letter-spacing: 3px;
					margin-top: 8px;
					opacity: 0.9;
					font-weight: 400;
				}
			</style>
			<div class="container">
				<h1>Henzy98</h1>
				<div class="subtitle">Developer</div>
			</div>
		</div>
	</foreignObject>
</svg>
