<svg fill="none" viewBox="0 0 800 100" width="800" height="100" xmlns="http://www.w3.org/2000/svg">
	<foreignObject width="100%" height="100%">
		<div xmlns="http://www.w3.org/1999/xhtml">
			<style>
				@keyframes gradientText {
				  0% {
				    background-position: 0% 50%;
				  }
				  50% {
				    background-position: 100% 50%;
				  }
				  100% {
				    background-position: 0% 50%;
				  }
				}

				@keyframes pulse {
					0%, 100% {
						opacity: 1;
						transform: scale(1);
					}
					50% {
						opacity: 0.7;
						transform: scale(1.05);
					}
				}

				@keyframes float {
					0%, 100% {
						transform: translateY(0px);
					}
					50% {
						transform: translateY(-10px);
					}
				}

				.code-icon {
					position: absolute;
					font-size: 24px;
					opacity: 0.3;
					animation: float 3s ease-in-out infinite;
				}

				h1 {
				  font-family: 'Inter',
					-apple-system,
					BlinkMacSystemFont, 
					'Segoe UI', 
					'Roboto', 
					'Oxygen', 
					'Ubuntu', 
					'Cantarell', 
					'Fira Sans', 
					'Droid Sans', 
					'Helvetica Neue', 
					sans-serif;
				  margin: 0;
				  font-size: 3.5em;
				  font-weight: 900;
				  letter-spacing: -.05em;
				  text-align: center;
				  background: linear-gradient(270deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #f5576c 75%, #667eea 100%);
				  background-size: 200%;
				  background-clip: text;
				  -webkit-background-clip: text;
				  -webkit-text-fill-color: transparent;
				  animation: gradientText 3s ease infinite, pulse 2s ease-in-out infinite;
				  position: relative;
				  z-index: 1;
				}

				.container {
					position: relative;
					display: flex;
					align-items: center;
					justify-content: center;
					height: 100px;
					background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
					border-radius: 10px;
				}
			</style>
			<div class="container">
				<div class="code-icon" style="left: 10%; animation-delay: 0s;">&lt;/&gt;</div>
				<div class="code-icon" style="left: 20%; animation-delay: 0.5s;">{ }</div>
				<div class="code-icon" style="left: 30%; animation-delay: 1s;">#</div>
				<div class="code-icon" style="right: 10%; animation-delay: 0.3s;">&lt;/&gt;</div>
				<div class="code-icon" style="right: 20%; animation-delay: 0.8s;">{ }</div>
				<div class="code-icon" style="right: 30%; animation-delay: 1.3s;">#</div>
				<h1>Status</h1>
			</div>
		</div>
	</foreignObject>
</svg>
